[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/providers/dejavu_provider.py"]  # heavy optional dep; exercised via availability-guard tests only

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
